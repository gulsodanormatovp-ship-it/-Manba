<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manba</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #58a6ff;
    --text: #e6edf3;
    --text-dim: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky; top: 0;
    background: var(--bg);
    z-index: 10;
  }
  header .mark {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #06141f; font-size: 14px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header span.tag { font-size: 12px; color: var(--text-dim); margin-left: 4px; }
  main { max-width: 820px; margin: 0 auto; padding: 24px; }
  .row { display: flex; gap: 10px; margin-bottom: 20px; }
  input, textarea {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input { flex: 1; }
  textarea { width: 100%; font-family: ui-monospace, monospace; resize: vertical; }
  button {
    background: var(--accent);
    color: #06141f;
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card:hover { border-color: var(--accent); }
  .card .name { font-weight: 600; }
  .card .meta { font-size: 12px; color: var(--text-dim); }
  .back { color: var(--accent); cursor: pointer; font-size: 14px; margin-bottom: 16px; display: inline-block; }
  .file-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    background: var(--panel); cursor: pointer;
  }
  .file-row:hover { border-color: var(--accent); }
  pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .empty { color: var(--text-dim); text-align: center; padding: 40px 0; }
  h2 { font-size: 20px; margin: 0 0 16px; }
  h3 { font-size: 15px; margin: 20px 0 10px; color: var(--text-dim); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="mark">M</div>
  <h1>Manba <span class="tag">— loyihalaringizni saqlang va ulashing</span></h1>
</header>

<main id="app"></main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, doc, getDoc,
    query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ====== Firebase konfiguratsiyasi ======
  const firebaseConfig = {
    apiKey: "AIzaSyBkN0bTvtXV6OmylK2zfVCSB4EAqlX4gnE",
    authDomain: "zehinai-uz.firebaseapp.com",
    projectId: "zehinai-uz",
    storageBucket: "zehinai-uz.firebasestorage.app",
    messagingSenderId: "563968666858",
    appId: "1:563968666858:web:0250da87f7da70be62fb93"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  // ========================================

  const root = document.getElementById('app');
  let currentProject = null;

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function renderProjectList() {
    currentProject = null;
    root.innerHTML = `
      <h2>Loyihalar</h2>
      <div class="row">
        <input id="newProjectName" placeholder="Yangi loyiha nomi..." />
        <button id="createProjectBtn">Yaratish</button>
      </div>
      <div id="projectList"><p class="empty">Yuklanmoqda...</p></div>
    `;

    document.getElementById('createProjectBtn').onclick = async () => {
      const name = document.getElementById('newProjectName').value.trim();
      if (!name) return;
      await addDoc(collection(db, 'projects'), { name, createdAt: serverTimestamp() });
      renderProjectList();
    };

    const q = query(collection(db, 'projects'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    const listEl = document.getElementById('projectList');
    if (snap.empty) {
      listEl.innerHTML = '<p class="empty">Hali loyiha yo\'q. Birinchisini yarating!</p>';
      return;
    }
    listEl.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div><div class="name">${esc(data.name)}</div></div><div class="meta">Ochish →</div>`;
      card.onclick = () => renderProject(d.id, data.name);
      listEl.appendChild(card);
    });
  }

  async function renderProject(projectId, projectName) {
    currentProject = projectId;
    root.innerHTML = `
      <span class="back" id="backBtn">← Loyihalar</span>
      <h2>${esc(projectName)}</h2>
      <h3>Yangi fayl qo'shish</h3>
      <div class="row">
        <input id="fileName" placeholder="fayl-nomi.txt" />
      </div>
      <textarea id="fileContent" rows="8" placeholder="Kod yoki matnni shu yerga yozing..."></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="addFileBtn">Faylni saqlash</button>
      </div>
      <h3>Fayllar</h3>
      <div id="fileList"><p class="empty">Yuklanmoqda...</p></div>
      <div id="fileView"></div>
    `;

    document.getElementById('backBtn').onclick = renderProjectList;

    document.getElementById('addFileBtn').onclick = async () => {
      const name = document.getElementById('fileName').value.trim();
      const content = document.getElementById('fileContent').value;
      if (!name) return;
      await addDoc(collection(db, 'projects', projectId, 'files'), {
        name, content, createdAt: serverTimestamp()
      });
      renderProject(projectId, projectName);
    };

    const q = query(collection(db, 'projects', projectId, 'files'), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    const listEl = document.getElementById('fileList');
    if (snap.empty) {
      listEl.innerHTML = '<p class="empty">Hali fayl yo\'q.</p>';
      return;
    }
    listEl.innerHTML = '';
    snap.forEach(d => {
      const data = d.data();
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `<span>📄 ${esc(data.name)}</span><span class="meta">Ko'rish</span>`;
      row.onclick = () => {
        document.getElementById('fileView').innerHTML =
          `<h3>${esc(data.name)}</h3><pre>${esc(data.content)}</pre>`;
      };
      listEl.appendChild(row);
    });
  }

  renderProjectList();
</script>

</body>
</html>
